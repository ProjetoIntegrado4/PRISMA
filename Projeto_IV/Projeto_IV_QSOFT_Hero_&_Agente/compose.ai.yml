# Agente de capacitação (gabarito A4). Estende a aplicação base sem mudar o volume do PostgreSQL principal.
# Síncrono (REST): navegador -> Spring Boot -> FastAPI (perfil/ML) e Spring Boot -> FastAPI RAGAS.
# Assíncrono: FastAPI publica o treino no RabbitMQ (ml.training.requests) e o ml-worker consome.
# RAG: Spring AI + OpenAI no Spring Boot, embeddings no pgvector (ai-db).
services:
  backend:
    environment:
      AI_SERVICE_URL: http://ai-service:8000
      RAGAS_SERVICE_URL: http://ragas-service:8001
      AI_INTERNAL_TOKEN: ${AI_INTERNAL_TOKEN:?Defina AI_INTERNAL_TOKEN no arquivo .env}
      AI_VECTOR_DB_URL: jdbc:postgresql://ai-db:5432/qai_ai
      AI_DB_PASSWORD: ${AI_DB_PASSWORD}
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
      OPENAI_MODEL: ${OPENAI_MODEL:-gpt-4o-mini}
    depends_on:
      ai-db: {condition: service_healthy}

  ai-db:
    image: pgvector/pgvector:pg17
    restart: unless-stopped
    environment:
      POSTGRES_DB: qai_ai
      POSTGRES_USER: qai_ai
      POSTGRES_PASSWORD: ${AI_DB_PASSWORD:?Defina AI_DB_PASSWORD no arquivo .env}
    ports:
      # Para rodar o Spring pelo IntelliJ (AI_VECTOR_DB_URL padrão: localhost:5433).
      - "127.0.0.1:5433:5432"
    volumes:
      - ai_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U qai_ai -d qai_ai"]
      interval: 5s
      timeout: 3s
      retries: 20
    networks: [app_net]

  rabbitmq:
    image: rabbitmq:4-management-alpine
    restart: unless-stopped
    environment:
      RABBITMQ_DEFAULT_USER: qai
      RABBITMQ_DEFAULT_PASS: ${AI_RABBIT_PASSWORD:?Defina AI_RABBIT_PASSWORD no arquivo .env}
    ports:
      - "127.0.0.1:${AI_RABBIT_MANAGEMENT_PORT:-15672}:15672"
    volumes:
      - rabbit_data:/var/lib/rabbitmq
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "-q", "ping"]
      interval: 10s
      timeout: 10s
      retries: 20
    networks: [app_net]

  # FastAPI: perfil observado a partir dos CSVs, previsão ML (REST) e producer do treino (RabbitMQ).
  ai-service:
    image: prisma-agente-ia:local
    build: ./ai-service
    restart: unless-stopped
    environment: &ai-env
      AI_DATABASE_URL: postgresql://qai_ai:${AI_DB_PASSWORD}@ai-db:5432/qai_ai
      RABBITMQ_URL: amqp://qai:${AI_RABBIT_PASSWORD}@rabbitmq:5672/%2F
      AI_INTERNAL_TOKEN: ${AI_INTERNAL_TOKEN}
      PRISMA_DADOS_DIR: /data
      TZ: America/Sao_Paulo
    ports:
      - "127.0.0.1:8000:8000"
    volumes: &ai-volumes
      - type: bind
        source: ${PRISMA_DADOS_DIR:-./dados/csv_preenchidos}
        target: /data
        read_only: true
    depends_on:
      ai-db: {condition: service_healthy}
      rabbitmq: {condition: service_healthy}
    healthcheck:
      test: ["CMD", "python", "-c", "import os,urllib.request; urllib.request.urlopen(urllib.request.Request('http://localhost:8000/health',headers={'X-Internal-Token':os.environ['AI_INTERNAL_TOKEN']}),timeout=5)"]
      interval: 20s
      timeout: 8s
      retries: 5
    networks: [app_net]

  # Consumer: treina a regressão logística a partir da fila ml.training.requests (ACK manual).
  # Reutiliza a imagem do ai-service (construir a mesma imagem em paralelo estourava a memória do Docker).
  ml-worker:
    image: prisma-agente-ia:local
    pull_policy: never
    command: ["python", "worker.py"]
    restart: unless-stopped
    environment: *ai-env
    volumes: *ai-volumes
    depends_on:
      ai-service: {condition: service_healthy}
    networks: [app_net]

  # FastAPI RAGAS: POST /experiments/run e GET /experiments/{id}, métricas com a OpenAI.
  ragas-service:
    image: prisma-agente-ia:local
    pull_policy: never
    command: ["uvicorn", "ragas_api:app", "--host", "0.0.0.0", "--port", "8001"]
    restart: unless-stopped
    environment:
      <<: *ai-env
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
      OPENAI_MODEL: ${OPENAI_MODEL:-gpt-4o-mini}
    ports:
      - "127.0.0.1:8001:8001"
    depends_on:
      ai-service: {condition: service_healthy}
    networks: [app_net]

volumes:
  ai_data:
  rabbit_data:
