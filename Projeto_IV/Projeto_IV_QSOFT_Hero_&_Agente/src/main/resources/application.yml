spring:
  # Agente de capacitação (gabarito A4): Spring AI com OpenAI. A chave vem só do .env (OPENAI_API_KEY);
  # sem chave o backend sobe normalmente e o agente avisa que falta configurar.
  ai:
    openai:
      api-key: ${OPENAI_API_KEY:sem-chave-configurada}
      chat:
        options:
          model: ${OPENAI_MODEL:gpt-4o-mini}
          temperature: 0.2
      embedding:
        options:
          model: ${OPENAI_EMBEDDING_MODEL:text-embedding-3-small}
    model:
      image: none
      audio:
        speech: none
        transcription: none
      moderation: none

  application:
    name: prisma-ia-backend
  config:
    import:
      - classpath:produtividade.yml
      # Lê o .env da raiz do projeto ao rodar fora do Docker (IntelliJ, mvn spring-boot:run).
      - optional:file:.env[.properties]
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/iadb}
    username: ${DB_USER:ia}
    password: ${DB_PASSWORD:ia}
  jpa:
    hibernate:
      ddl-auto: update
    open-in-view: false
    properties:
      hibernate:
        format_sql: true

# Base de dados dos cadastros de empresas, funcionários e admins (companies.csv, employees.csv,
# departments.csv e admins.csv). O caminho vem só da variável PRISMA_DADOS_DIR, definida no arquivo .env
# da raiz do projeto; o painel de produtividade lê a mesma pasta.
prisma:
  dados:
    dir: ${PRISMA_DADOS_DIR:dados/csv_preenchidos}
  # Carga de demonstração (service/demonstracao/DemonstracaoSeeder): políticas, aceites e consumo de IA,
  # derivados da base de dados. Só preenche tabela vazia. Desligue com PRISMA_DEMONSTRACAO=false.
  demonstracao:
    popular: ${PRISMA_DEMONSTRACAO:true}

agente:
  # Serviço Python (perfil a partir dos CSVs e ML) e serviço RAGAS (métricas), ambos FastAPI.
  ai-service-url: ${AI_SERVICE_URL:http://localhost:8000}
  ragas-service-url: ${RAGAS_SERVICE_URL:http://localhost:8001}
  internal-token: ${AI_INTERNAL_TOKEN:}
  # Banco vetorial (pgvector) do agente: tabela course_embeddings e recomendações geradas.
  vetor:
    url: ${AI_VECTOR_DB_URL:jdbc:postgresql://localhost:5433/qai_ai}
    usuario: ${AI_VECTOR_DB_USER:qai_ai}
    senha: ${AI_DB_PASSWORD:}

services:
  alert:
    base-url: ${ALERT_SERVICE_URL:http://localhost:3001}

app:
  auth:
    username: ${TEMP_LOGIN_USERNAME:admin@prisma.com}
    password: ${TEMP_LOGIN_PASSWORD:Prisma123!}
    name: ${TEMP_LOGIN_NAME:Administrador Prisma}
    # Conta temporária com o perfil Gerente (igual ao admin, mas sem cadastrar empresa).
    gerente:
      username: ${TEMP_GERENTE_USERNAME:gerente@prisma.com}
      password: ${TEMP_GERENTE_PASSWORD:Prisma123!}
      name: ${TEMP_GERENTE_NAME:Gerente Prisma}
    # Conta temporária com o perfil Funcionário (visão restrita). Admins e funcionários da base (admins.csv e
    # employees.csv) também entram, com o e-mail e a senha deles.
    funcionario:
      username: ${TEMP_FUNCIONARIO_USERNAME:funcionario@prisma.com}
      password: ${TEMP_FUNCIONARIO_PASSWORD:Prisma123!}
      name: ${TEMP_FUNCIONARIO_NAME:Funcionário Prisma}
  # Pontos de AI Literacy por capacitação registrada (US PP-19). Usados em service/PontuacaoAiLiteracy.
  # PRELIMINAR – validar com o PO: o documento do projeto ainda não define esses pesos (RF10/RF11).
  ai-literacy:
    pontos-curso: 10
    pontos-certificacao: 20

# Regra de custos de IA (US PP-18). Aplicada só em service/custos/RegraCusto:
# custo por uso = input_tokens / 1000 × preço de entrada + output_tokens / 1000 × preço de saída (ai_models).
# PRELIMINAR – validar com o PO: moeda/câmbio, status cobrados e quais aplicações contam como agente.
custos:
  versao-regra: custos-v1-preliminar
  vigencia: "2026-10-22"
  moeda: USD
  status-cobrados: [success]
  aplicacoes-agente: [Pipeline Interno, Integracao via Backend Interno, API Direta]
  limite-colaboradores: 10

server:
  servlet:
    session:
      cookie:
        http-only: true
        same-site: lax

management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      show-details: always
