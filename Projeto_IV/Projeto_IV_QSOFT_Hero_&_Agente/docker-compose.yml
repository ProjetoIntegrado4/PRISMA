services:

  postgres:
    image: postgres:17-alpine
    container_name: prisma-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: iadb
      POSTGRES_USER: ia
      POSTGRES_PASSWORD: ia
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ia -d iadb"]
      interval: 5s
      timeout: 3s
      retries: 15
    networks:
      - app_net

  pgadmin:
    image: dpage/pgadmin4:9
    container_name: prisma-pgadmin
    restart: unless-stopped
    depends_on:
      - postgres
    environment:
      PGADMIN_DEFAULT_EMAIL: admin@admin.com
      PGADMIN_DEFAULT_PASSWORD: admin
      PGADMIN_CONFIG_SERVER_MODE: "False"
    ports:
      - "5050:80"
    volumes:
      - pgadmin_data:/var/lib/pgadmin
    networks:
      - app_net

  alert-service:
    build:
      context: ./alert-service
    container_name: prisma-alert-service
    restart: unless-stopped
    environment:
      PORT: 3001
    ports:
      - "3001:3001"
    networks:
      - app_net

  backend:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: prisma-backend
    restart: unless-stopped
    environment:
      DB_URL: jdbc:postgresql://postgres:5432/iadb
      DB_USER: ia
      DB_PASSWORD: ia
      ALERT_SERVICE_URL: http://alert-service:3001
      TEMP_LOGIN_USERNAME: ${TEMP_LOGIN_USERNAME:-admin@prisma.com}
      TEMP_LOGIN_PASSWORD: ${TEMP_LOGIN_PASSWORD:-Prisma123!}
      TEMP_LOGIN_NAME: ${TEMP_LOGIN_NAME:-Administrador Prisma}
      # Dentro do contêiner a base de dados fica sempre em /app/dados; a pasta real do computador
      # vem do PRISMA_DADOS_DIR do arquivo .env (veja o volume abaixo).
      PRISMA_DADOS_DIR: /app/dados
      # Agente de IA (agente.html). Ficam aqui também, e não só no compose.ai.yml, para que recriar só o
      # backend (docker compose up -d --force-recreate backend) não apague a ligação com o serviço de IA.
      AI_SERVICE_URL: ${AI_SERVICE_URL:-http://ai-service:8000}
      AI_INTERNAL_TOKEN: ${AI_INTERNAL_TOKEN:-}
      RAGAS_SERVICE_URL: ${RAGAS_SERVICE_URL:-http://ragas-service:8001}
      AI_VECTOR_DB_URL: ${AI_VECTOR_DB_URL:-jdbc:postgresql://ai-db:5432/qai_ai}
      AI_DB_PASSWORD: ${AI_DB_PASSWORD:-}
      # Chave da OpenAI (Spring AI): só no arquivo .env, nunca no código.
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
      OPENAI_MODEL: ${OPENAI_MODEL:-gpt-4o-mini}
    ports:
      - "8080:8080"
    volumes:
      # Base de dados em CSV (cadastros e painel). Leitura e escrita: o que for cadastrado no site
      # é gravado nos CSVs, e o que for acrescentado nos CSVs aparece no site.
      - type: bind
        source: ${PRISMA_DADOS_DIR:-./dados/csv_preenchidos}
        target: /app/dados
    depends_on:
      - postgres
      - alert-service
    networks:
      - app_net

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: prisma-frontend-bff
    restart: unless-stopped
    environment:
      PORT: 3000
      API_BASE_URL: http://backend:8080
    ports:
      - "3000:3000"
    volumes:
      - ./frontend/public:/app/public:ro
    depends_on:
      - backend
    networks:
      - app_net

volumes:
  postgres_data:
  pgadmin_data:

networks:
  app_net:
    driver: bridge